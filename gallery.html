        <!-- メイン -->

            <!-- イベントCG -->



<section id="event">

            src="images/gallery_event_01.png"

            onclick="openImage(this.src)">

        <img
            src="images/gallery_event_03.png"
            alt="イベントCG03"
            onclick="openImage(this.src)">

        <div class="coming-card">
            Coming Soon...
        </div>

        <div class="coming-card">
            Coming Soon...
        </div>

        <div class="coming-card">
            Coming Soon...
        </div>

    </div>

</section>   

<section id="background">

    <h2>背景</h2>

    <div class="event-gallery">

        <img
        src="images/gallery_background_01.png"
        alt="背景01"
        onclick="openImage(this.src)">

        <div class="coming-card">
            Coming Soon...
        </div>

        <div class="coming-card">
            Coming Soon...
        </div>

    </div>

</section>


            <!-- メインビジュアル -->

                <h2>メインビジュアル</h2>

            <a href="index.html" class="back">

        </main>

    </div> <!-- layout -->

</div> <!-- container -->

<!-- 拡大表示 -->
<div id="image-viewer">

    <span id="close-button" onclick="closeImage()">
        ×
    </span>

    <img
        id="viewer-image"
        onclick="event.stopPropagation()">

</div>

<script>

const viewer = document.getElementById("image-viewer");
const image = document.getElementById("viewer-image");

function openImage(src){

    image.src = src;

    viewer.style.display = "flex";

    requestAnimationFrame(() => {

        viewer.style.opacity = "1";
        image.style.opacity = "1";
        image.style.transform = "scale(1)";

    });

}

function closeImage(){

    viewer.style.opacity = "0";

    image.style.opacity = "0";

    image.style.transform = "scale(.95)";

    setTimeout(() => {

        viewer.style.display = "none";

    }, 350);

}

viewer.onclick = closeImage;

</script>

<div id="menu-container"></div>

<script src="menu-loader.js"></script>

</body>
